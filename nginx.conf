server {
  listen 8080;
  root /usr/share/nginx/html;

  # Single-page app: /output (and any other route) serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite's hashed bundles never change, so browsers can cache them forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Tracking models and WASM (~40 MB): cache for a day.
  location ~ ^/(models|mediapipe)/ {
    add_header Cache-Control "public, max-age=86400";
  }

  gzip on;
  gzip_types text/css application/javascript application/wasm;
}
